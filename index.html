            "@type": "Question",
            "name": "How does the perspective correction actually work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When you drag the four corners, the tool calculates a 3D perspective transformation. It then \"pulls\" those corners to form a perfect rectangle, straightening your image mathematically. Think of it like stretching a rubber photo until it looks perfectly flat and centered."
            }
          },
          {
            "@type": "Question",
            "name": "Why is PerspectiveFix better than just cropping?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cropping only cuts out a piece of the image, but it doesn't fix the tilt or \"keystone\" effect. PerspectiveFix actually warps the pixels to correct the angle, ensuring that text is aligned and proportions are preserved."
            }
          },

            "@type": "Question",
